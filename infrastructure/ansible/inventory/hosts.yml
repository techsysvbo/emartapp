---
# E-MART – Inventory
# Update hosts to match your deployment targets.
all:
  children:
    dev:
      hosts:
        dev_server:
          ansible_host: "{{ lookup('env', 'DEV_HOST') | default('localhost') }}"
          ansible_user: "{{ lookup('env', 'DEV_USER') | default('ubuntu') }}"
          ansible_ssh_private_key_file: "{{ lookup('env', 'SSH_KEY_FILE') | default('~/.ssh/id_ed25519') }}"
    staging:
      hosts: {}
    prod:
      hosts: {}
