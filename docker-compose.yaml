version: "3.8"

# ---------------------------------------------------------------------------
# E-MART – Phase 1: Docker Compose foundation
#
# All secrets are supplied via the .env file (see .env.example).
# For local development, run scripts/vault-sync.sh to populate .env from
# HashiCorp Vault, or copy .env.example to .env and fill in the values.
#
# Usage:
#   docker compose up           (app stack only)
#   docker compose --profile observability up   (app + Prometheus/Grafana/Loki)
# ---------------------------------------------------------------------------

networks:
  emartnet:
    driver: bridge

volumes:
  emongo_data:
  emartdb_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:

  # ── Angular frontend served by Nginx ─────────────────────────────────────
  client:
    build:
      context: ./client
    container_name: client
    networks:
      - emartnet
    restart: unless-stopped
    depends_on:
      - api
      - webapi

  # ── Node.js / Express API (user auth + shop) → MongoDB ───────────────────
  api:
    build:
      context: ./nodeapi
    container_name: api
    networks:
      - emartnet
    restart: unless-stopped
    ports:
      - "${API_PORT:-5000}:5000"
    environment:
      MONGO_URI: "${MONGO_URI:-mongodb://emongo:27017/epoc}"
      JWT_SECRET: "${JWT_SECRET}"
      SMTP_ENABLED: "${SMTP_ENABLED:-false}"
      SMTP_SERVICE: "${SMTP_SERVICE:-gmail}"
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      ADMIN_EMAILS: "${ADMIN_EMAILS:-}"
      PORT: "5000"
    depends_on:
      emongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/', r => process.exit(r.statusCode >= 500 ? 1 : 0)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ── Spring Boot API (books) → MySQL ──────────────────────────────────────
  webapi:
    build:
      context: ./javaapi
    container_name: webapi
    networks:
      - emartnet
    restart: unless-stopped
    ports:
      - "${WEBAPI_PORT:-9000}:9000"
    environment:
      MYSQL_URL: "${MYSQL_URL:-jdbc:mysql://emartdb:3306/books?allowPublicKeyRetrieval=true&useSSL=false}"
      MYSQL_USER: "${MYSQL_USER:-root}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD}"
      SERVER_PORT: "9000"
    depends_on:
      emartdb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/9000 && echo -e 'GET /webapi/books HTTP/1.0\r\n\r\n' >&3 && grep -q 'HTTP' <&3"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Nginx reverse proxy / API gateway ────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: nginx
    networks:
      - emartnet
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - "./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"
    depends_on:
      - client
      - api
      - webapi

  # ── MongoDB (local dev – swap MONGO_URI for Atlas in production) ──────────
  emongo:
    image: mongo:6
    container_name: emongo
    networks:
      - emartnet
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: "${MONGO_INITDB_DATABASE:-epoc}"
    volumes:
      - emongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ── MySQL (local dev – replace with managed DB in production) ────────────
  emartdb:
    image: mysql:8.0.33
    container_name: emartdb
    networks:
      - emartnet
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_PASSWORD}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-books}"
    volumes:
      - emartdb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_PASSWORD}"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Prometheus (observability profile) ───────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: prometheus
    profiles: ["observability"]
    networks:
      - emartnet
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - "./infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"

  # ── Grafana (observability profile) ──────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.2
    container_name: grafana
    profiles: ["observability"]
    networks:
      - emartnet
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - "./infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning:ro"
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki

  # ── Loki log aggregation (observability profile) ──────────────────────────
  loki:
    image: grafana/loki:2.9.8
    container_name: loki
    profiles: ["observability"]
    networks:
      - emartnet
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - "./infrastructure/observability/loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro"
      - loki_data:/loki
    command: -config.file=/etc/loki/loki-config.yaml

  # ── Promtail log shipper (observability profile) ──────────────────────────
  promtail:
    image: grafana/promtail:2.9.8
    container_name: promtail
    profiles: ["observability"]
    networks:
      - emartnet
    restart: unless-stopped
    volumes:
      - "./infrastructure/observability/promtail/promtail-config.yaml:/etc/promtail/promtail-config.yaml:ro"
      - "/var/log:/var/log:ro"
      - "/var/lib/docker/containers:/var/lib/docker/containers:ro"
    command: -config.file=/etc/promtail/promtail-config.yaml
    depends_on:
      - loki

