sonar.projectKey=emartapp
sonar.projectName=E-MART Application
sonar.projectVersion=1.0

# Source directories (all three services)
sonar.sources=nodeapi,client/src,javaapi/src/main
sonar.tests=javaapi/src/test

# Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/e2e/**

# JavaScript/TypeScript
sonar.javascript.lcov.reportPaths=client/coverage/lcov.info

# Java
sonar.java.binaries=javaapi/target/classes
sonar.java.source=17

# Test coverage
sonar.coverage.exclusions=**/e2e/**,**/*.spec.ts,**/node_modules/**
